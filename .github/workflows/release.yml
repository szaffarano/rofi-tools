name: Release
permissions:
  contents: write
on:
  release:
    types: [published]
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust Toolchain
        id: rust_toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ steps.rust_toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        shell: bash
        run: |
          cargo build --release
      - name: Pack
        id: pack
        shell: bash
        run: |
          files=( $(cargo metadata --no-deps --format-version 1 | jq -r '[.packages[].targets[] | select (.kind[] == "bin") | .name] | map("target/release/" + .) | .[]') )
          zip -j "rofi-tools.zip" "${files[@]}"
          sha256sum rofi-tools.zip | cut -d ' ' -f 1 > rofi-tools.zip.sha256sum
          cat rofi-tools.zip.sha256sum
      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: |
            rofi-tools.zip
            rofi-tools.zip.sha256sum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
